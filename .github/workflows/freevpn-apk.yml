name: freevpn-apk

# 只构建 Android APK 并发布到 Release（手机可直接下载）。
# 上游的 build job 条件严格等于 chen08209/FlClash，在 fork 里必然跳过。
#
# === NDK 踩坑记录（三次失败，值得完整保留）===
# 现象: rust_api 的 build hook 报
#   Bad state: No libclang under .../ndk/27.3.13750724/toolchains/llvm/prebuilt/
#   linux-x86_64 (lib or lib64); the NDK Flutter passed cannot run bindgen
#
# 排查结论（逐条实测）:
#   1) NDK 27.x 系列天生不带 libclang（只有 lib/ 没有 libclang.so），
#      而 28.1 / 29.0 / 30.0 都带。所以问题不是"没装 NDK"，
#      而是 Flutter 恰好选了一个不会带 libclang 的版本。
#   2) nttld/setup-ndk 按 Google 仓库的 release 号(r27c/r28b)下载，
#      而 android/gradle/libs.versions.toml 里的 28.2.13676358 是内部
#      build 号，直接拿它去下载会 404。
#   3) Flutter 的 NDK 解析顺序里 ANDROID_NDK_HOME 环境变量优先级最高
#      (getNdkDirectoriesInResolutionOrder)，其后才按版本号从新到旧。
#
# 因此这里显式把 ANDROID_NDK_HOME 指向 28.1.13356709 —— runner 上已预装
# 且确认含 libclang.so，绕开所有版本推断的不确定性。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/freevpn-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'core/**'
      - 'plugins/**'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  # runner 预装且确认含 libclang 的 NDK，直接指定，避免版本推断踩坑
  NDK_VERSION: '28.1.13356709'

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Ensure required NDK is present
        run: |
          NDK="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          if [ ! -f "$NDK/source.properties" ]; then
            echo "NDK ${{ env.NDK_VERSION }} not present, installing via sdkmanager..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.NDK_VERSION }}" || true
          fi
          echo "--- using NDK: $NDK ---"
          cat "$NDK/source.properties" 2>/dev/null | head -3 || echo "MISSING $NDK"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib" 2>/dev/null | grep -i libclang || echo "NO libclang"

      - name: Show flutter ndk expectation
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null

      - name: Install dependencies
        run: flutter pub get

      # android/app/build.gradle.kts:
      #   有 release 签名 -> 包名 com.follow.clash
      #   无 release 签名 -> 回退 debug 签名并把包名改成 com.follow.clash.dev
      # 后者会与已安装的官方 FlClash 共存而不是覆盖，所以生成临时签名密钥。
      # keystore.jks 与 local.properties 都在 android/.gitignore 中，不会进仓库。
      - name: Generate signing key
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias freevpn \
            -storepass FreeVpn_2026_Kx9 \
            -keypass FreeVpn_2026_Kx9 \
            -dname "CN=freeVPN, OU=Personal, O=freeVPN, L=Unknown, S=Unknown, C=CN"
          ls -la keystore.jks

      - name: Configure signing
        run: |
          printf 'storePassword=FreeVpn_2026_Kx9\nkeyAlias=freevpn\nkeyPassword=FreeVpn_2026_Kx9\n' > android/local.properties
          cat android/local.properties

      - name: Build release APK
        env:
          APP_ENV: stable
        run: flutter build apk --release --split-per-abi

      - name: Inspect package name
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*arm64-v8a*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1)
          if [ -n "$AAPT" ] && [ -n "$APK" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | head -1 || true
          fi

      - name: List APKs
        run: find build/app/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freevpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: freevpn-apk-${{ github.run_number }}
          name: freeVPN APK #${{ github.run_number }}
          body: |
            自动构建的 freeVPN Android APK。

            下载 **arm64-v8a** 版本（绝大多数现代手机适用）。
            不确定架构就先试 arm64-v8a，装不上再试 armeabi-v7a。

            内置 mihomo 内核，与电脑端同源。
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false