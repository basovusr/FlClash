name: freevpn-apk

# 只构建 Android APK 并发布到 Release（手机可直接下载）。
# 上游的 build job 条件严格等于 chen08209/FlClash，在 fork 里必然跳过，
# 所以这里单独实现一份。
#
# 关于 NDK 版本（第一次构建失败的根因，值得记下）:
#   android/gradle/libs.versions.toml 里声明的是 ndkVersion = 28.2.13676358。
#   plugins/rust_api/hook/build.dart 需要从 Flutter 传入的编译器路径向上找
#   lib/lib64 下的 libclang.*，用于 rquickjs 的 bindgen。
#   第一次失败是因为只装了上游 workflow 用的 r28c，与 Granle 要的 28.2.13676358
#   不是同一个东西，Flutter 于是回退到它自己的默认 27.3.13750724 —— 也没装，
#   导致 "No libclang ... cannot run bindgen for rquickjs"。
#   这里把两个版本都装上，无论 Flutter 最终传哪个都能找到 libclang。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/freevpn-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'core/**'
      - 'plugins/**'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_CATALOG: 28.2.13676358
  NDK_FLUTTER_DEFAULT: 27.3.13750724

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 装两个 NDK：Gradle 声明的那个 + Flutter 的默认那个
      - name: Setup NDK (Gradle declared)
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_CATALOG }}
          link-to-sdk: true

      - name: Setup NDK (Flutter default fallback)
        uses: nttld/setup-ndk@v1
        id: ndk2
        continue-on-error: true
        with:
          ndk-version: ${{ env.NDK_FLUTTER_DEFAULT }}
          link-to-sdk: true

      - name: Inspect installed NDKs and libclang
        run: |
          echo "=== installed NDK versions ==="
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || echo "(no ndk dir)"
          echo
          for v in "$ANDROID_HOME"/ndk/*; do
            echo "--- $v ---"
            ls -d "$v"/toolchains/llvm/prebuilt/linux-x86_64/lib* 2>/dev/null || echo "  no lib/lib64"
            find "$v"/toolchains/llvm/prebuilt/linux-x86_64 -maxdepth 2 \
              -name 'libclang*' 2>/dev/null | head -3
          done

      - name: Install dependencies
        run: flutter pub get

      # android/app/build.gradle.kts 的逻辑:
      #   有 release 签名 -> 包名 com.follow.clash
      #   无 release 签名 -> 回退 debug 签名并把包名变成 com.follow.clash.dev
      # 后者会与已安装的官方 FlClash 共存而不是覆盖，所以生成临时签名密钥。
      # keystore.jks 与 local.properties 都在 android/.gitignore 中，不会进仓库。
      - name: Generate signing key
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias freevpn \
            -storepass FreeVpn_2026_Kx9 \
            -keypass FreeVpn_2026_Kx9 \
            -dname "CN=freeVPN, OU=Personal, O=freeVPN, L=Unknown, S=Unknown, C=CN"
          ls -la keystore.jks

      - name: Configure signing
        run: |
          printf 'storePassword=FreeVpn_2026_Kx9\nkeyAlias=freevpn\nkeyPassword=FreeVpn_2026_Kx9\n' > android/local.properties
          cat android/local.properties

      - name: Build release APK
        env:
          APP_ENV: stable
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # 兜底：把已安装 NDK 的 lib 目录加进 LIBCLANG_PATH 候选
          for v in "$ANDROID_HOME"/ndk/*; do
            for d in "$v/toolchains/llvm/prebuilt/linux-x86_64/lib" \
                     "$v/toolchains/llvm/prebuilt/linux-x86_64/lib64"; do
              if [ -d "$d" ] && ls "$d"/libclang.* >/dev/null 2>&1; then
                echo "Found libclang in $d"
              fi
            done
          done
          flutter build apk --release --split-per-abi

      - name: Inspect package name
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*arm64-v8a*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1)
          if [ -n "$AAPT" ] && [ -n "$APK" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | head -1 || true
          fi

      - name: List APKs
        run: find build/app/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freevpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: freevpn-apk-${{ github.run_number }}
          name: freeVPN APK #${{ github.run_number }}
          body: |
            自动构建的 freeVPN Android APK。

            下载 **arm64-v8a** 版本（绝大多数现代手机适用）。
            不确定架构就先试 arm64-v8a，装不上再试 armeabi-v7a。

            内置 mihomo 内核，与电脑端同源。
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
